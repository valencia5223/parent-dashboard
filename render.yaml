# Render 웹 서비스 (New → Blueprint 에서 parent-dashboard 저장소를 고르면 이 파일을 읽음)
# server.js 가 화면(dist)을 내보내고 /api/* 로 키가 필요한 공공 API 를 대신 부른다.
# 키는 Render 대시보드 → 서비스 → Environment 에서 넣는다(sync: false = 저장소에 값을 두지 않음).
services:
  - type: web
    name: parent-dashboard
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_GO_KR_KEY
        sync: false
      - key: OPINET_KEY
        sync: false
