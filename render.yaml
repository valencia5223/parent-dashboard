# Render 정적 사이트 (New → Blueprint 에서 parent-dashboard 저장소를 고르면 이 파일을 읽음)
# 주소: https://parent-dashboard-zvjr.onrender.com
# 공공 API 는 브라우저에서 바로 못 부르므로(CORS) /api/* 를 원래 주소로 넘긴다(vite.config.js 와 같게).
# 키는 Render → 서비스 → Environment 에 넣고 다시 배포한다(빌드할 때 화면 코드에 들어감).
services:
  - type: web
    name: parent-dashboard
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_DATA_GO_KR_KEY
        sync: false
      - key: VITE_OPINET_KEY
        sync: false
      - key: VITE_SEOUL_SUBWAY_KEY
        sync: false
    routes:
      - type: rewrite
        source: /api/gbis/*
        destination: https://apis.data.go.kr/6410000/*
      - type: rewrite
        source: /api/rtms/*
        destination: https://apis.data.go.kr/1613000/*
      - type: rewrite
        source: /api/opinet/*
        destination: https://www.opinet.co.kr/api/*
      - type: rewrite
        source: /api/subway/*
        destination: http://swopenapi.seoul.go.kr/api/subway/*
      # 날씨(기상청)·미세먼지(에어코리아) — src/weather.js
      - type: rewrite
        source: /api/kma/*
        destination: https://apis.data.go.kr/1360000/*
      - type: rewrite
        source: /api/airkorea/*
        destination: https://apis.data.go.kr/B552584/*
      - type: rewrite
        source: /*
        destination: /index.html
