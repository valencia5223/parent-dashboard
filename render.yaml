# Render 정적 사이트 (New → Blueprint 에서 parent-dashboard 저장소를 고르면 이 파일을 읽음)
# 주소: https://parent-dashboard.onrender.com (이름이 이미 쓰이고 있으면 Render 가 뒤에 글자를 붙임)
services:
  - type: web
    name: parent-dashboard
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
